<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c5cff"/>
      <stop offset="100%" style="stop-color:#c084fc"/>
    </linearGradient>
    <linearGradient id="flag" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#b22234"/>
      <stop offset="33%" style="stop-color:#b22234"/>
      <stop offset="33%" style="stop-color:#ffffff"/>
      <stop offset="66%" style="stop-color:#ffffff"/>
      <stop offset="66%" style="stop-color:#3c3b6e"/>
      <stop offset="100%" style="stop-color:#3c3b6e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="roundedRect">
      <rect x="0" y="0" width="256" height="256" rx="52" ry="52"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="52" fill="url(#bg)"/>

  <!-- Subtle grid texture -->
  <rect width="256" height="256" rx="52" fill="none" stroke="#7c5cff" stroke-width="0.5" opacity="0.08"/>

  <!-- Purple glow orb top-right -->
  <circle cx="210" cy="46" r="60" fill="#7c5cff" opacity="0.07"/>
  <!-- Purple glow orb bottom-left -->
  <circle cx="46" cy="210" r="50" fill="#c084fc" opacity="0.05"/>

  <!-- Speech bubble body -->
  <rect x="38" y="52" width="160" height="108" rx="18" fill="url(#accent)" filter="url(#glow)"/>

  <!-- Speech bubble tail -->
  <polygon points="72,160 52,194 100,160" fill="url(#accent)"/>

  <!-- Subtitle lines inside bubble -->
  <rect x="58" y="76" width="120" height="12" rx="6" fill="white" opacity="0.95"/>
  <rect x="58" y="98" width="88" height="12" rx="6" fill="white" opacity="0.95"/>
  <rect x="58" y="120" width="104" height="12" rx="6" fill="white" opacity="0.7"/>

  <!-- US flag mini badge bottom-right -->
  <rect x="154" y="164" width="68" height="46" rx="8" fill="url(#flag)"/>
  <!-- Flag border -->
  <rect x="154" y="164" width="68" height="46" rx="8" fill="none" stroke="white" stroke-width="2" opacity="0.4"/>
  <!-- Stars area overlay -->
  <rect x="154" y="164" width="27" height="19" rx="3" fill="#3c3b6e" opacity="0.6"/>
  <!-- Stars (simplified) -->
  <text x="158" y="178" font-size="9" fill="white" opacity="0.9" font-family="sans-serif">★★★</text>
  <text x="159" y="187" font-size="9" fill="white" opacity="0.9" font-family="sans-serif">★★</text>

  <!-- "F" forced label -->
  <circle cx="54" cy="196" r="22" fill="#0a0a0f" stroke="url(#accent)" stroke-width="2.5"/>
  <text x="54" y="203" text-anchor="middle" font-size="22" font-weight="900" fill="url(#accent)" font-family="Arial Black, sans-serif">F</text>
</svg>
